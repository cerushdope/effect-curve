<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Effect Curve</title>
<meta name="description" content="Log what you took, how much, and when — see the felt effect over time." />
<style>
  :root { --ink:#1A1D21; --muted:#6A7078; --hairline:#E4E5E1; --paper:#F7F7F4; --accent:#2E4D54; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:16px/1.6 Inter,"Helvetica Neue",system-ui,sans-serif;
         display:grid; place-items:center; min-height:100vh; padding:2rem 1.25rem; }
  main { max-width:44ch; text-align:center; }
  .mark { width:56px; height:56px; border-radius:14px; background:var(--accent);
          display:grid; place-items:center; margin:0 auto 1.1rem; }
  .mark svg { width:38px; height:38px; }
  h1 { font-size:2rem; margin:0 0 .3rem; letter-spacing:-.02em; }
  p.tag { color:var(--muted); margin:0 0 2rem; }
  .links { display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; }
  a.btn { text-decoration:none; padding:.6rem 1.1rem; border-radius:8px;
          border:1px solid var(--hairline); color:var(--ink); background:#fff; font-size:.95rem; }
  a.btn--go { background:var(--accent); color:var(--paper); border-color:var(--accent); }
  a.btn:hover { border-color:var(--muted); }
  footer { margin-top:2.5rem; font-size:.8rem; color:var(--muted); }
  footer a { color:var(--muted); }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#EDEEEA; --muted:#9AA1A8; --hairline:#2C3136; --paper:#16191C; }
    a.btn { background:#1C2024; }
  }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M 10,80 C 20,80 24,22 38,21 C 52,20 54,56 66,66 C 76,74 82,77 91,78"
            fill="none" stroke="#F7F7F4" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Effect Curve</h1>
  <p class="tag">Log what you took, how much, and when — see the felt effect over time.</p>
  <div class="links">
    <a class="btn btn--go" href="./frontend/">Open the app</a>
    <a class="btn" href="https://github.com/cerushdope/effect-curve">Source</a>
    <a class="btn" href="./privacy.html">Privacy</a>
  </div>
  <footer>
    Illustrative estimates from published population figures.
    Not a dosing or clinical tool. <a href="./privacy.html">Privacy policy</a>.
  </footer>
</main>
</body>
</html>
